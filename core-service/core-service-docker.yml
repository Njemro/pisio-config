server:
  port: 8082

spring:
  datasource:
    url: jdbc:mysql://core-db:3306/pisio_core?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

keycloak:
  server-url: http://keycloak:8080
  realm: pisio
  client-id: core-service-admin
  client-secret: ${KEYCLOAK_CLIENT_SECRET}
  student-default-password: ${KEYCLOAK_STUDENT_DEFAULT_PASSWORD}
  
eureka:
  instance:
    instance-id: ${spring.application.name}:${server.port}
    
auth:
  domain: ${AUTH_DOMAIN}