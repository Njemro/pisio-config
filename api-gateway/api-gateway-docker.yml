server:
  port: 8765
  ssl:
    enabled: true
    key-store: classpath:keystore.p12
    key-store-password: ${KEYSTORE_PASSWORD}
    key-store-type: PKCS12
    key-alias: mygatewaycert


spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://192.168.100.8:8080/realms/pisio
          jwk-set-uri: http://keycloak:8080/realms/pisio/protocol/openid-connect/certs
  
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
      routes:
        - id: attendance-websocket-route
          uri: lb://attendance-service
          predicates:
            - Path=/ws-session/**


eureka:
  instance:
    instance-id: ${spring.application.name}:${server.port}